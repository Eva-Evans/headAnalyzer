version: "3.9"

services:
  db:
    image: postgres:16
    container_name: herd-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: herd_forecast
      POSTGRES_USER: herd_user
      POSTGRES_PASSWORD: herd_password
    ports:
      - "15432:5432"
    volumes:
      - db_data:/var/lib/postgresql/data
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql:ro

  app:
    build: .
    container_name: herd-app
    restart: unless-stopped
    depends_on:
      - db
    environment:
      - ADMIN_KEY=supersecret123
      - POSTGRES_DSN=postgresql+psycopg2://herd_user:herd_password@db:5432/herd_forecast
    ports:
      - "8510:8501"   # Streamlit снаружи
    volumes:
      - .:/app        # чтобы код можно было менять без пересборки (опционально)

volumes:
  db_data:
